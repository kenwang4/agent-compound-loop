[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-compound-loop"
version = "0.1.0"
description = "Recursive compound engineering helpers: writeback candidates + quality-gate docs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aichill" }]
keywords = ["agents", "writeback", "compound-engineering", "quality-gates"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
writeback-candidate = "writeback_candidate.cli:main"

[project.urls]
Homepage = "https://github.com/kenwang4/agent-compound-loop"
Issues = "https://github.com/kenwang4/agent-compound-loop/issues"
Changelog = "https://github.com/kenwang4/agent-compound-loop/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["writeback_candidate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
